<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4F46E5" />
  <meta name="description" content="ST SOCIAL — the digital social hub for student life in St Andrews. See what's happening on campus and around town." />
  <title>ST SOCIAL · St Andrews</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%234F46E5'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='white' font-family='Arial'%3EST%3C/text%3E%3C/svg%3E" />
  <script>
    // Apply theme before first paint to avoid a flash.
    (function () {
      try {
        var t = localStorage.getItem('sttheme');
        if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="bg-decor" aria-hidden="true"></div>
  <div id="app">
    <div id="demo-banner" class="demo-banner" hidden>
      <span class="demo-dot"></span>
      <span><strong>DEMO DATA</strong> — sample events shown for preview. Live source connected: University of St Andrews news.</span>
      <button id="demo-banner-close" aria-label="Dismiss">×</button>
    </div>
    <header id="app-header" class="app-header">
      <div class="ah-left"><button id="back-btn" class="icon-btn" hidden aria-label="Back">←</button><span id="ah-title" class="ah-title"></span></div>
      <div class="ah-right" id="ah-actions"></div>
    </header>
    <main id="view" class="view" role="main"></main>
    <button id="fab" class="fab" aria-label="Create">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <nav id="bottom-nav" class="bottom-nav" aria-label="Primary"></nav>
  </div>
  <div id="toaster" class="toaster" aria-live="polite"></div>
  <div id="sheet-root"></div>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
